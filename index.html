<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Audio Batch Re-Uploader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 22px; color: #7aa2ff; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 22px; }
  .card {
    background: #171a23;
    border: 1px solid #232838;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #9aa6c7;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    background: #0d0f15;
    border: 1px solid #232838;
    color: #d6e0ff;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    padding: 10px;
    border-radius: 6px;
    outline: none;
    margin-bottom: 12px;
  }
  textarea { resize: vertical; min-height: 100px; }
  input:focus, textarea:focus { border-color: #4a6cf7; }
  button {
    background: #4a6cf7;
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #3a5ce5; }
  button:disabled { background: #2a3350; cursor: not-allowed; }
  .log {
    margin-top: 14px;
    background: #0d0f15;
    border: 1px solid #232838;
    border-radius: 6px;
    padding: 10px;
    font-family: 'Consolas', monospace;
    font-size: 11px;
    color: #9aa6c7;
    max-height: 350px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .hint { font-size: 11px; color: #666; margin-top: 6px; line-height: 1.5; }
  a { color: #7aa2ff; }
  .success { color: #6f6; font-weight: bold; }
  .error { color: #f66; font-weight: bold; }
  .info { color: #7aa2ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Roblox Audio Batch Re-Uploader</h1>
  <div class="sub">Paste banyak rbxassetid, tool ini bakal proses satu per satu</div>

  <div class="card">
    <label>API Key Open Cloud (Untuk Upload)</label>
    <input type="password" id="apiKey" placeholder="Masukkan API Key (centang assets:write & assets:read)">
    
    <label style="margin-top:12px;">User ID Roblox Lo</label>
    <input type="text" id="userId" placeholder="Contoh: 123456789 (Cek di profil lo)">
    
    <label style="margin-top:12px;">Cookie .ROBLOSECURITY (Untuk Download)</label>
    <input type="password" id="cookie" placeholder="Masukkan cookie _|WARNING:-DO-NOT-SHARE...">
  </div>

  <div class="card">
    <label>Daftar rbxassetid Lama (Pisahkan dengan Enter atau Koma)</label>
    <textarea id="sourceIds" placeholder="115807882232957&#10;112162922738826&#10;rbxassetid://123456789"></textarea>
    
    <label>Nama Asset Baru (Otomatis ditambahin nomor)</label>
    <input type="text" id="name" value="Re-uploaded Audio">
    <label>Deskripsi</label>
    <input type="text" id="desc" value="Batch re-uploaded via tool">
    
    <button id="btnProcess">Mulai Proses Batch</button>
    <div class="log" id="log">Siap memproses antrean.</div>
  </div>
</div>
<script>
(function () {
  const btn = document.getElementById('btnProcess');
  const log = document.getElementById('log');

  function write(msg, className = '') {
    const span = document.createElement('span');
    span.className = className;
    span.textContent = msg + '\n';
    log.appendChild(span);
    log.scrollTop = log.scrollHeight;
  }

  btn.addEventListener('click', async function () {
    const apiKey = document.getElementById('apiKey').value.trim();
    const userId = document.getElementById('userId').value.trim();
    const cookie = document.getElementById('cookie').value.trim();
    const rawIds = document.getElementById('sourceIds').value.trim();
    const baseName = document.getElementById('name').value.trim() || 'Re-uploaded Audio';
    const desc = document.getElementById('desc').value.trim() || '';

    if (!apiKey) return write('API Key kosong.', 'error');
    if (!userId) return write('User ID kosong.', 'error');
    if (!cookie) return write('Cookie kosong.', 'error');
    if (!rawIds) return write('Daftar ID kosong.', 'error');

    // Ekstrak semua angka dari input (bisa format rbxassetid:// atau angka doang)
    const idArray = [...new Set(rawIds.match(/\d{5,}/g) || [])];
    
    if (idArray.length === 0) {
      return write('Tidak ada ID valid yang ditemukan.', 'error');
    }

    btn.disabled = true;
    log.innerHTML = '';
    write(`Memulai batch process untuk ${idArray.length} ID...`, 'info');
    write('--------------------------------------------------');

    let successCount = 0;
    let failCount = 0;
    const resultList = [];

    for (let i = 0; i < idArray.length; i++) {
      const sourceId = idArray[i];
      const currentName = `${baseName} ${i + 1}`;
      
      write(`\n[${i + 1}/${idArray.length}] Memproses ID: ${sourceId}`);

      try {
        // Langkah 1: Download
        write('  -> Download audio pakai Cookie...');
        const dlRes = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceId: sourceId, cookie: cookie })
        });
        const dlData = await dlRes.json();

        if (!dlData.success) {
          throw new Error(`Gagal download: ${JSON.stringify(dlData.error || dlData)}`);
        }
        write(`  -> Download OK (${Math.round(dlData.size / 1024)} KB)`);

        // Langkah 2: Upload
        write('  -> Upload ulang pakai API Key...');
        const createRes = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey: apiKey,
            userId: userId,
            name: currentName,
            description: desc,
            fileBase64: dlData.base64,
            contentType: dlData.contentType
          })
        });
        const createData = await createRes.json();
        
        if (!createData.operationId) {
          throw new Error(`Gagal buat operasi upload: ${JSON.stringify(createData)}`);
        }

        // Langkah 3: Polling Status
        write('  -> Menunggu Roblox memproses...');
        let assetId = null;
        for (let j = 0; j < 15; j++) {
          await new Promise(r => setTimeout(r, 3000));
          const pollRes = await fetch('/api/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ apiKey: apiKey, operationId: createData.operationId })
          });
          const pollData = await pollRes.json();
          
          if (pollData.done && pollData.assetId) {
            assetId = pollData.assetId;
            break;
          }
          if (pollData.error) {
            throw new Error(`Roblox Error: ${JSON.stringify(pollData.error)}`);
          }
        }

        if (assetId) {
          write(`  -> [SUKSES] ID Lama: ${sourceId} | ID Baru: rbxassetid://${assetId}`, 'success');
          resultList.push({ old: sourceId, new: assetId });
          successCount++;
        } else {
          throw new Error('Timeout, gagal dapat Asset ID baru.');
        }

      } catch (err) {
        write(`  -> [GAGAL] ${err.message}`, 'error');
        failCount++;
      }
      
      // Jeda antar ID biar ga kena rate limit / anti-spam Roblox
      await new Promise(r => setTimeout(r, 2000));
    }

    write('\n--------------------------------------------------');
    write(`SELESAI! Sukses: ${successCount}, Gagal: ${failCount}`, 'info');
    
    if (resultList.length > 0) {
      write('\nDaftar ID Baru (siap di-copy):');
      resultList.forEach(r => {
        write(`Lama: ${r.old}  -->  Baru: rbxassetid://${r.new}`);
      });
    }

    btn.disabled = false;
  });
})();
</script>
</body>
</html>
