<body class="min-h-screen bg-gray-50 text-gray-900 dark:bg-[#0f1115] dark:text-slate-200 p-4 md:p-8">

            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>

            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
            Batch Input
          </h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold flex justify-between">

              <textarea id="sourceIds" class="w-full bg-gray-50 dark:bg-[#0f1115] border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 h-40 font-mono text-xs" placeholder="Paste teks nama lagu & ID di sini..."></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">

                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">Prefix Nama</label>

              </div>
              <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1 font-semibold">Jeda (Detik)</label>
                <input type="number" id="delay" value="4" min="1" max="20" class="w-full bg-gray-50 dark:bg-[#0f1115] border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
              </div>
            </div>
            <button id="btnProcess" class="w-full mt-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all transform active:scale-[0.98] disabled:opacity-50 flex justify-center items-center gap-2">
              <svg id="iconPlay" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <svg id="iconLoading" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              <span id="btnText">Mulai Proses Batch</span>
            </button>
          </div>
        </div>

      </div>

      <div class="lg:col-span-7 flex flex-col h-[calc(100vh-8rem)] min-h-[600px]">
        <div class="bg-white dark:bg-[#1a1c23] border border-gray-200 dark:border-gray-800 rounded-2xl p-6 shadow-sm mb-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
              <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              Status & Hasil
            </h2>
            <div class="flex gap-2 w-full sm:w-auto">
              <button id="btnDownload" class="flex-1 sm:flex-none bg-blue-500/10 hover:bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/30 text-xs font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-2 disabled:opacity-50" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> TXT
              </button>
              <button id="btnCopy" class="flex-1 sm:flex-none bg-green-500/10 hover:bg-green-500/20 text-green-600 dark:text-green-400 border border-green-500/30 text-xs font-bold py-2 px-4 rounded-lg flex items-center justify-center gap-2 disabled:opacity-50" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg> Copy
              </button>
            </div>
          </div>
          <div class="mb-2 flex justify-between text-xs text-gray-500 font-medium">
            <span id="progressText">Menunggu antrean...</span>
            <span id="etaText">ETA: --</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="w-full bg-gray-200 dark:bg-[#0f1115] rounded-full h-3 mb-6 overflow-hidden">
            <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-50 dark:bg-[#0f1115] border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col items-center justify-center">
              <span class="text-xs text-gray-500 font-semibold mb-1">SUKSES</span>
              <span id="statSuccess" class="text-2xl font-bold text-green-500">0</span>
            </div>
            <div class="bg-gray-50 dark:bg-[#0f1115] border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col items-center justify-center">
              <span class="text-xs text-gray-500 font-semibold mb-1">GAGAL</span>
              <span id="statFail" class="text-2xl font-bold text-red-500">0</span>
            </div>
          </div>
        </div>

        <div class="bg-white dark:bg-[#0a0b0e] border border-gray-200 dark:border-gray-800 rounded-2xl flex-1 flex flex-col shadow-sm overflow-hidden">
          <div class="bg-gray-100 dark:bg-[#1a1c23] border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex justify-between items-center">
            <div class="flex gap-2">
              <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
              <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
              <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
            </div>
            <span class="text-xs text-gray-500 font-mono">system@ultimate:~</span>
          </div>
          <div id="log" class="p-4 font-mono text-sm overflow-y-auto flex-1 whitespace-pre-wrap">Sistem siap.</div>
        </div>

  <div id="historyModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1a1c23] border border-gray-200 dark:border-gray-800 rounded-2xl w-full max-w-2xl max-h-[80vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center p-4 border-b border-gray-200 dark:border-gray-800">
        <h3 class="text-lg font-bold">Riwayat Spoof</h3>
        <button id="btnCloseHistory" class="text-gray-500 hover:text-red-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
      </div>
      <div class="p-4 overflow-y-auto flex-1" id="historyList"></div>
      <div class="p-4 border-t border-gray-200 dark:border-gray-800 flex justify-end">
        <button id="btnClearHistory" class="text-xs bg-red-500/10 text-red-500 font-bold py-2 px-4 rounded-lg">Hapus Semua</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const el = {
        apiKey: document.getElementById('apiKey'), userId: document.getElementById('userId'), cookie: document.getElementById('cookie'),
        sourceIds: document.getElementById('sourceIds'), idCount: document.getElementById('idCount'), name: document.getElementById('name'),
        delay: document.getElementById('delay'), btnProcess: document.getElementById('btnProcess'), btnText: document.getElementById('btnText'),
        iconPlay: document.getElementById('iconPlay'), iconLoading: document.getElementById('iconLoading'), btnCopy: document.getElementById('btnCopy'),
        btnDownload: document.getElementById('btnDownload'), log: document.getElementById('log'), progressBar: document.getElementById('progressBar'),
        progressPercent: document.getElementById('progressPercent'), progressText: document.getElementById('progressText'),
        etaText: document.getElementById('etaText'), statSuccess: document.getElementById('statSuccess'), statFail: document.getElementById('statFail'),
        btnTheme: document.getElementById('btnTheme'), btnHistory: document.getElementById('btnHistory'), historyModal: document.getElementById('historyModal'),
        btnCloseHistory: document.getElementById('btnCloseHistory'), historyList: document.getElementById('historyList'), btnClearHistory: document.getElementById('btnClearHistory')
      };
      let successfulData = [];

      if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
      el.btnTheme.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); });

      const loadSettings = () => { el.apiKey.value = localStorage.getItem('spoofer_apiKey') || ''; el.userId.value = localStorage.getItem('spoofer_userId') || ''; el.cookie.value = localStorage.getItem('spoofer_cookie') || ''; };
      const saveSettings = () => { localStorage.setItem('spoofer_apiKey', el.apiKey.value.trim()); localStorage.setItem('spoofer_userId', el.userId.value.trim()); localStorage.setItem('spoofer_cookie', el.cookie.value.trim()); };
      [el.apiKey, el.userId, el.cookie].forEach(input => input.addEventListener('change', saveSettings));
      loadSettings();

      function write(msg, type = '', isHTML = false) {
        const div = document.createElement('div'); if (type) div.className = `log-${type}`;
        if (isHTML) div.innerHTML = msg; else div.textContent = msg;
        el.log.appendChild(div); el.log.scrollTop = el.log.scrollHeight;
      }
      function formatTime(s) { return s < 60 ? `~${Math.round(s)}s` : `~${Math.floor(s/60)}m ${Math.round(s%60)}s`; }
      function updateProgress(c, t, s) {
        const pct = Math.round((c/t)*100); el.progressBar.style.width = pct + '%'; el.progressPercent.textContent = pct + '%'; el.progressText.textContent = `Memproses ${c} dari ${t}`;
        if (c > 0 && c < t) { const e = (Date.now()-s)/1000; el.etaText.textContent = `ETA: ${formatTime((e/c)*(t-c))}`; }
        else if (c === t) el.etaText.textContent = 'Selesai'; else el.etaText.textContent = 'ETA: --';
      }

      function parseAudioData(text) {
        const lines = text.split('\n'); const result = []; let currentName = '';
        for (let line of lines) {
          line = line.trim(); if (!line) continue;
          const idMatch = line.match(/\d{5,}/); 
          if (idMatch) {
            const id = idMatch[0]; let name = line.replace(id, '').replace(/^[\d\.\-\s]+/, '').trim();
            if (!name) name = currentName; if (!name) name = 'Unknown Audio';
            result.push({ id: id, name: name }); currentName = ''; 
          } else currentName = line.replace(/^[\d\.\-\s]+/, '').trim();
        }
        const uniqueData = []; const seenIds = new Set();
        for (const item of result) { if (!seenIds.has(item.id)) { seenIds.add(item.id); uniqueData.push(item); } }
        return uniqueData;
      }
      el.sourceIds.addEventListener('input', () => { el.idCount.textContent = parseAudioData(el.sourceIds.value).length + ' Audio'; });

      function getHistory() { return JSON.parse(localStorage.getItem('spoofer_history') || '[]'); }
      function addHistory(name, oldId, newId) { const h = getHistory(); h.unshift({ name, oldId, newId, date: new Date().toISOString() }); localStorage.setItem('spoofer_history', JSON.stringify(h.slice(0, 500))); }
      function renderHistory() {
        const h = getHistory(); el.historyList.innerHTML = '';
        if (h.length === 0) return el.historyList.innerHTML = '<p class="text-center text-gray-500 py-4">Belum ada riwayat.</p>';
        h.forEach(item => {
          const div = document.createElement('div'); div.className = 'mb-3 p-3 bg-gray-50 dark:bg-[#0f1115] border border-gray-200 dark:border-gray-800 rounded-lg text-sm flex flex-col gap-1';
          const title = document.createElement('div'); title.className = 'font-bold text-indigo-600 dark:text-indigo-400'; title.textContent = item.name;
          const details = document.createElement('div'); details.className = 'text-gray-500 flex justify-between items-center text-xs';
          details.innerHTML = `<span>${item.oldId} &rarr; <span class="text-green-500 font-mono">${item.newId}</span></span>`;
          const dateSpan = document.createElement('span'); dateSpan.textContent = new Date(item.date).toLocaleDateString();
          details.appendChild(dateSpan); div.appendChild(title); div.appendChild(details); el.historyList.appendChild(div);
        });
      }
      el.btnHistory.addEventListener('click', () => { renderHistory(); el.historyModal.classList.remove('hidden'); });
      el.btnCloseHistory.addEventListener('click', () => el.historyModal.classList.add('hidden'));
      el.btnClearHistory.addEventListener('click', () => { if(confirm('Hapus semua riwayat?')) { localStorage.removeItem('spoofer_history'); renderHistory(); } });

      const getSuccessString = () => successfulData.map(item => `-- ${item.name}\nrbxassetid://${item.id}`).join('\n\n');
      el.btnCopy.addEventListener('click', () => { navigator.clipboard.writeText(getSuccessString()).then(() => { const o = el.btnCopy.innerHTML; el.btnCopy.innerHTML = '<span>✅ Copied!</span>'; setTimeout(() => el.btnCopy.innerHTML = o, 2000); }); });
      el.btnDownload.addEventListener('click', () => {
        const blob = new Blob([getSuccessString()], { type: 'text/plain' }); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `spoofed_audio_${Date.now()}.txt`; a.click(); URL.revokeObjectURL(url);
      });

      el.btnProcess.addEventListener('click', async function () {
        const apiKey = el.apiKey.value.trim(), userId = el.userId.value.trim(), cookie = el.cookie.value.trim(), rawInput = el.sourceIds.value.trim(), baseName = el.name.value.trim() || 'Spoofed', delaySec = parseInt(el.delay.value) || 4;
        if (!apiKey || !userId || !cookie) return write('❌ Semua form konfigurasi wajib diisi!', 'error');
        const audioList = parseAudioData(rawInput); if (audioList.length === 0) return write('❌ Tidak ada ID valid.', 'error');

        el.btnProcess.disabled = true; el.iconPlay.classList.add('hidden'); el.iconLoading.classList.remove('hidden');
        el.log.innerHTML = ''; el.statSuccess.textContent = '0'; el.statFail.textContent = '0'; el.btnCopy.disabled = true; el.btnDownload.disabled = true; successfulData = [];
        let successCount = 0, failCount = 0, currentIdx = 0; const startTime = Date.now();

        write(`🚀 Memulai proses untuk ${audioList.length} Audio...`, 'info');
        updateProgress(0, audioList.length, startTime);

        for (let i = 0; i < audioList.length; i++) {
          const item = audioList[i], sourceId = item.id, audioName = item.name, uploadName = baseName ? `${baseName} - ${audioName}` : audioName;
          currentIdx = i + 1;
          write(`\n[${currentIdx}/${audioList.length}] `, 'info'); write(`🎵 ${audioName} `, 'title'); write(`🆔 ${sourceId}`);

          let success = false, retries = 3; 
          while (retries > 0 && !success) {
            try {
              write('  ⚡ Memproses di server...', 'info');
              const res = await fetch('/api/process', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sourceId, cookie, apiKey, userId, name: uploadName, description: 'Batch processed' }) });
              
              const resData = await res.json(); // Selalu baca JSON dulu
              if (!res.ok || !resData.success) {
                // Cuma anggap Rate Limit kalau errornya beneran 429
                if (resData.error && resData.error.includes('429')) throw new Error('RATE_LIMIT');
                throw new Error(resData.error || 'Gagal di server');
              }

              write('  ⏳ Menunggu Approve...', 'info');
              let assetId = null;
              for (let j = 0; j < 15; j++) {
                await new Promise(r => setTimeout(r, 2500));
                const pollRes = await fetch('/api/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ apiKey, operationId: resData.operationId }) });
                const pollData = await pollRes.json();
                if (pollData.done && pollData.assetId) { assetId = pollData.assetId; break; }
                if (pollData.error) throw new Error(JSON.stringify(pollData.error));
              }

              if (assetId) {
                write(`  ✅ SUKSES: <a href="https://www.roblox.com/library/${assetId}" target="_blank" class="underline text-green-400">rbxassetid://${assetId}</a>`, 'success', true);
                successfulData.push({ name: audioName, id: assetId }); addHistory(audioName, sourceId, assetId); successCount++; success = true;
              } else throw new Error('Timeout menunggu Roblox');
            } catch (err) {
              if (err.message === 'RATE_LIMIT') {
                retries--; if (retries > 0) { write(`  ⚠️ Kena limit (429). Nunggu 8 detik...`, 'warn'); await new Promise(r => setTimeout(r, 8000)); }
                else { write(`  ❌ GAGAL: Batas limit tercapai.`, 'error'); failCount++; }
              } else { write(`  ❌ GAGAL: ${err.message}`, 'error'); failCount++; break; }
            }
          }
          el.statSuccess.textContent = successCount; el.statFail.textContent = failCount; updateProgress(currentIdx, audioList.length, startTime);
          if (currentIdx < audioList.length) await new Promise(r => setTimeout(r, delaySec * 1000));
        }

        write(`\n🎉 SELESAI. Sukses: ${successCount}, Gagal: ${failCount}`, 'success');
        if (successfulData.length > 0) { el.btnCopy.disabled = false; el.btnDownload.disabled = false; }
        el.btnProcess.disabled = false; el.iconLoading.classList.add('hidden'); el.iconPlay.classList.remove('hidden'); el.etaText.textContent = 'Selesai';
      });
    })();
  </script>
</body>
</html>
